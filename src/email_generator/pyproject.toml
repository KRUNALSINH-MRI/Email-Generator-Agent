[project]
name = "email-generator"
version = "0.1.0"
description = "Professional Email Generator Agent"
requires-python = ">=3.14"
dependencies = [
    "azure-ai-agentserver-invocations>=1.0.0",
    "azure-identity>=1.25.3",
    "fastmcp>=3.4.7",
    "langchain>=1.3.15",
    "langchain-azure-ai[hosting]>=1.2.8",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["email_generator"]
